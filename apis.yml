name: Distil Networks
description: Distil Networks was a bot detection and mitigation company founded in 2011 and backed by
  Techstars, providing automated-threat protection, web scraping defense, account-takeover prevention,
  and API security that blocked malicious bots and credential stuffing across web, mobile, and API
  surfaces. Distil Networks was acquired by Imperva in 2019 and its technology now lives on as Imperva
  Advanced Bot Protection; the distilnetworks.com domain redirects to Imperva and there is no
  independent Distil Networks developer surface or public API. This profile is retained in the API
  Evangelist network as a historical company record.
